services:
  - type: web
    name: abito-web
    env: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn abito_web.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: abito-db
          property: connectionString

databases:
  - name: abito-db
